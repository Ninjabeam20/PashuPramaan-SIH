services:
  - type: web
    name: pashupramaan-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pashupramaan-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        # Update this after Vercel gives you your frontend URL
        value: https://pashupramaan.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: pashupramaan-db
    plan: free
    databaseName: pashupramaan
